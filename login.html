<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin Login - The Fun Space</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="auth.css">
<style>
main{display:grid;place-items:center;min-height:calc(100vh - var(--topbar-h,72px) - 4.5rem)}
.card{width:min(26rem,92vw);text-align:center}
.shield{width:84px;height:84px;margin:0 auto .6rem;filter:drop-shadow(0 8px 24px rgba(138,92,255,.7));animation:float 4s ease-in-out infinite}
@keyframes float{50%{translate:0 -8px}}
h1{font-size:2.2rem}.sub{color:var(--muted);font-weight:600;margin-top:.3rem}
form{text-align:left}.pw{position:relative}.pw button{position:absolute;right:.5rem;top:50%;translate:0 -50%;background:none;border:0;color:var(--muted);font-weight:800;cursor:pointer;padding:.4rem .6rem}
.btn.full{width:100%;margin-top:1.2rem}
</style></head>
<body>
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
<main>
  <section class="card" id="card">
    <svg class="shield" viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff5fa2"/><stop offset="1" stop-color="#8a5cff"/></linearGradient></defs>
      <path d="M32 4 56 13v17c0 15-10 26-24 30C18 56 8 45 8 30V13z" fill="url(#g)"/><rect x="21" y="29" width="22" height="16" rx="4" fill="#fff"/>
      <path d="M25 29v-5a7 7 0 0 1 14 0v5" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/><circle cx="32" cy="37" r="3" fill="#8a5cff"/></svg>
    <h1 class="grad">Admin Login</h1><p class="sub">Authorized admins only</p>
    <form id="f" autocomplete="on">
      <label for="u">Username</label><input id="u" name="username" autocomplete="username" maxlength="40" required autofocus>
      <label for="p">Password</label>
      <div class="pw"><input id="p" name="password" type="password" autocomplete="current-password" maxlength="200" required><button type="button" id="eye" aria-label="Show password">Show</button></div>
      <button class="btn full" id="go">Log in</button>
      <div class="msg" id="msg" role="alert"></div>
    </form>
  </section>
</main>
<script src="topbar.js"></script>
<script>
const $=id=>document.getElementById(id),F=window.FunSpace;
if(sessionStorage.getItem('fs_token'))location.replace('admin.html');
$('eye').onclick=()=>{const s=$('p').type==='password';$('p').type=s?'text':'password';$('eye').textContent=s?'Hide':'Show'};
function fail(t){$('msg').textContent=t;$('card').classList.remove('shake');void $('card').offsetWidth;$('card').classList.add('shake')}
$('f').onsubmit=async e=>{
  e.preventDefault();$('msg').textContent='';
  if(!F.api)return fail('The admin backend is not connected yet (see setup instructions).');
  $('go').disabled=true;
  try{
    const r=await fetch(F.api+'/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('u').value.trim(),password:$('p').value})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(d.error||'Login failed');
    sessionStorage.setItem('fs_token',d.token);location.href='admin.html';
  }catch(x){fail(x instanceof TypeError?'Could not reach the server.':x.message)}
  finally{$('go').disabled=false;$('p').value=''}
};
</script></body></html>
